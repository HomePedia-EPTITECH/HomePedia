services:
  postgres:
    image: postgres:16
    container_name: homepedia_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homepedia}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: homepedia_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-homepedia_raw}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ../packages/etl/database/mongo/init:/docker-entrypoint-initdb.d:ro
      - ../packages/etl/database/mongo/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
