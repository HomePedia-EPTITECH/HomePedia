# Réduit DRASTIQUEMENT les logs Spark - Ne montre que les ERREURS

# Root logger - tout en ERROR
log4j.rootCategory=ERROR, console

# Appender pour la console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# TOUS les packages Spark/Hadoop/Netty en ERROR uniquement
log4j.logger.org.apache=ERROR
log4j.logger.org.spark_project=ERROR
log4j.logger.akka=ERROR
log4j.logger.org.apache.spark=ERROR
log4j.logger.org.apache.hadoop=ERROR
log4j.logger.org.apache.parquet=ERROR
log4j.logger.org.apache.spark.sql=ERROR
log4j.logger.com.mongodb=ERROR
log4j.logger.com.databricks=ERROR
log4j.logger.io.netty=ERROR

# Vos logs à vous
log4j.logger.HomePedia=INFO
log4j.logger.__main__=INFO

